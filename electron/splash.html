<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FRIDAY AI Voice Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 40%, #101426 0%, #06070c 80%, #030407 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif;
      color: #e2e8f0;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }
    .orb-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(6, 182, 212, 0.4);
      animation: ringPulse 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .pulse-ring-2 {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(168, 85, 247, 0.3);
      animation: ringPulse 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.2s;
    }
    .orb {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #38bdf8, #818cf8 45%, #6366f1 75%, #090d16 100%);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.45), 0 0 80px rgba(129, 140, 248, 0.25);
      animation: orbGlow 3s ease-in-out infinite alternate;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .waves {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .wave-bar {
      width: 3px;
      height: 16px;
      background: #ffffff;
      border-radius: 2px;
      animation: wave 1.2s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.15s; height: 26px; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; height: 38px; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; height: 24px; }
    .wave-bar:nth-child(5) { animation-delay: 0.6s; height: 14px; }

    .title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #ffffff 20%, #38bdf8 60%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: #94a3b8;
      margin-bottom: 32px;
      font-weight: 500;
      text-transform: uppercase;
    }
    .loader-bar {
      width: 220px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      animation: loaderSlide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes ringPulse {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @keyframes orbGlow {
      0% { transform: scale(0.96); filter: brightness(1); }
      100% { transform: scale(1.04); filter: brightness(1.2) drop-shadow(0 0 25px rgba(56, 189, 248, 0.6)); }
    }
    @keyframes wave {
      0% { transform: scaleY(0.4); opacity: 0.7; }
      100% { transform: scaleY(1.3); opacity: 1; }
    }
    @keyframes loaderSlide {
      0% { left: -40%; width: 30%; }
      50% { width: 50%; }
      100% { left: 100%; width: 30%; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="orb-wrapper">
      <div class="pulse-ring"></div>
      <div class="pulse-ring-2"></div>
      <div class="orb">
        <div class="waves">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </div>
    </div>
    <div class="title">FRIDAY</div>
    <div class="subtitle">Connecting Neural Voice Interface...</div>
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
  </div>
</body>
</html>
