# Friday-OS Hermes External Memory Provider Configs
# One per department profile — place in ~/.hermes/profiles/<dept>/config.yaml
# or reference via HERMES_EXTERNAL_MEMORY_PROVIDER env var

# ============================================================
# RESEARCH PROFILE
# ============================================================
research:
  external_memory:
    provider: "obsidian"
    vault_path: "/home/gopi/Downloads/Friday-OS/friday-memory/research"
    read_only: false
    scope: "department"
    index_file: "_index.json"

